<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme surfaces" subtitle="High-impact charcoal-blue mode" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:0; }
  .stage { padding:20px; background:var(--slate-900); display:flex; gap:14px; font-family:var(--font-sans); }
  .card { flex:1; background:#1b212b; border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius-md); padding:14px; }
  .t { color:#f4f7fa; font-weight:600; font-size:14px; }
  .s { color:#8b97a6; font-size:12px; margin-top:4px; }
  .glow { color:var(--blue-azure); font-weight:700; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
  <div class="stage" data-theme="dark">
    <div class="card"><div class="t">Surface · #1b212b</div><div class="s">Cards on charcoal-blue #14181f page</div><div class="glow">Brand blue glows ↗</div></div>
    <div class="card" style="background:var(--grad-brand); border:none;"><div class="t">Gradient panel</div><div class="s" style="color:rgba(255,255,255,.85)">Hero / Products / Insights</div></div>
  </div>
</body>
</html>
