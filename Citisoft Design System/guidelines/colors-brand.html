<!-- @dsCard group="Colors" viewport="700x150" name="Brand blues" subtitle="Azure, mid, deep — the CitiSoft core" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-card); }
  .row { display:flex; gap:14px; }
  .sw { flex:1; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-default); }
  .chip { height:64px; }
  .meta { padding:8px 10px; font-family:var(--font-sans); }
  .name { font-size:13px; font-weight:600; color:var(--text-strong); }
  .hex { font-family:var(--font-mono); font-size:12px; color:var(--text-muted); margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-azure)"></div><div class="meta"><div class="name">Azure</div><div class="hex">#2b9fd4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-mid)"></div><div class="meta"><div class="name">Mid blue</div><div class="hex">#2c79ba</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-deep)"></div><div class="meta"><div class="name">Deep navy</div><div class="hex">#255b9c</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="meta"><div class="name">Pressed</div><div class="hex">#1f4d85</div></div></div>
  </div>
</body>
</html>
