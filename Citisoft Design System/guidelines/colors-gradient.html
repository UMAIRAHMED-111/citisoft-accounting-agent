<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--surface-card); font-family:var(--font-sans); }
  .grad { height:74px; border-radius:var(--radius-lg); background:var(--grad-brand); box-shadow:var(--shadow-brand); display:flex; align-items:center; padding:0 22px; }

</style>
</head>
<body>
  <div class="grad"><span>linear-gradient(135°, #2b9fd4 → #2c79ba → #255b9c)</span></div>
  <div class="foot">var(--grad-brand) · buttons · accents · diagram highlights · gradient text</div>
</body>
</html>
