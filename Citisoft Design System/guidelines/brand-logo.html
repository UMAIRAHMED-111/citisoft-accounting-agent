<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:0; display:flex; font-family:var(--font-sans); }
  .pane { flex:1; height:160px; display:flex; align-items:center; justify-content:center; }
  .light { background:var(--surface-card); border-right:1px solid var(--border-default); }
  .dark { background:var(--slate-900); }
  img { width:220px; height:auto; }
</style>
</head>
<body>
  <div class="pane light"><img src="../assets/citisoft-logo.png" alt="Citisoft"></div>
  <div class="pane dark"><img src="../assets/citisoft-logo-white.png" alt="Citisoft"></div>
</body>
</html>
