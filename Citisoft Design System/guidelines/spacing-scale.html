<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px grid with 2/4px micro-steps" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--surface-card); font-family:var(--font-mono); }
  .row { display:flex; align-items:flex-end; gap:10px; }
  .c { text-align:center; }
  .bar { background:var(--grad-brand); border-radius:3px; width:26px; }
  .l { font-size:10px; color:var(--text-muted); margin-top:6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="c"><div class="bar" style="height:4px"></div><div class="l">4</div></div>
    <div class="c"><div class="bar" style="height:8px"></div><div class="l">8</div></div>
    <div class="c"><div class="bar" style="height:12px"></div><div class="l">12</div></div>
    <div class="c"><div class="bar" style="height:16px"></div><div class="l">16</div></div>
    <div class="c"><div class="bar" style="height:24px"></div><div class="l">24</div></div>
    <div class="c"><div class="bar" style="height:32px"></div><div class="l">32</div></div>
    <div class="c"><div class="bar" style="height:48px"></div><div class="l">48</div></div>
    <div class="c"><div class="bar" style="height:64px"></div><div class="l">64</div></div>
    <div class="c"><div class="bar" style="height:80px"></div><div class="l">80</div></div>
  </div>
</body>
</html>
