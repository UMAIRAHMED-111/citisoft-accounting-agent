<!-- @dsCard group="Type" viewport="700x320" name="Type scale" subtitle="Display → caption, Hanken Grotesk" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 22px; background:var(--surface-card); font-family:var(--font-sans); }
  .r { display:flex; align-items:baseline; gap:16px; padding:5px 0; border-bottom:1px solid var(--border-subtle); }
  .r:last-child { border-bottom:none; }
  .t { color:var(--text-strong); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); width:120px; text-align:right; }
</style>
</head>
<body>
  <div class="r"><div class="t" style="font-size:44px;font-weight:800;letter-spacing:-0.02em;">Display md</div><div class="tag">44 / 800</div></div>
  <div class="r"><div class="t" style="font-size:36px;font-weight:700;letter-spacing:-0.015em;">Heading 1</div><div class="tag">36 / 700</div></div>
  <div class="r"><div class="t" style="font-size:28px;font-weight:700;">Heading 2</div><div class="tag">28 / 700</div></div>
  <div class="r"><div class="t" style="font-size:22px;font-weight:600;">Heading 3</div><div class="tag">22 / 600</div></div>
  <div class="r"><div class="t" style="font-size:16px;font-weight:400;">Body — the quick brown fox</div><div class="tag">16 / 400</div></div>
  <div class="r"><div class="t" style="font-size:13px;font-weight:500;color:var(--text-muted)">Caption / metadata</div><div class="tag">13 / 500</div></div>
  <div class="r"><div class="t cs-overline">Overline · eyebrow</div><div class="tag">12 / 700</div></div>
</body>
</html>
