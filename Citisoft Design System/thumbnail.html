<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-sans)}
  .main{flex:0 0 75%;height:100%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center}
  .main img{width:56%;height:auto}
  .swatches{flex:1;height:100%;display:flex;flex-direction:column}
  .swatches div{flex:1}
</style>
</head>
<body>
  <div class="main"><img src="assets/citisoft-logo-white.png" alt="Citisoft Solutions"></div>
  <div class="swatches">
    <div style="background:#2b9fd4"></div>
    <div style="background:#2c79ba"></div>
    <div style="background:#255b9c"></div>
    <div style="background:#4a1e3d"></div>
  </div>
</body>
</html>
