<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:22px; background:var(--surface-page); }
  .row { display:flex; gap:24px; align-items:flex-start; }
  .toasts { display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Dialog, Toast, Tooltip, Button, IconButton } = window.CitisoftDesignSystem_1a14bd;
    const Info = () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>;
    function Demo() {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="row">
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <Button onClick={() => setOpen(true)}>Open dialog</Button>
            <Tooltip label="Routes to all qualified suppliers">
              <Button variant="secondary" leadingIcon={<Info/>}>Hover me</Button>
            </Tooltip>
          </div>
          <div className="toasts">
            <Toast tone="success" title="Quote submitted">Acme Steel was notified.</Toast>
            <Toast tone="warning" title="RFQ closes in 2 hours">3 suppliers have not responded.</Toast>
            <Toast tone="error" title="Missing delivery date">This RFQ can't be published yet.</Toast>
          </div>
          <Dialog open={open} onClose={() => setOpen(false)} title="Cancel this RFQ?"
            footer={<>
              <Button variant="secondary" onClick={() => setOpen(false)}>Keep it</Button>
              <Button variant="danger" onClick={() => setOpen(false)}>Cancel RFQ</Button>
            </>}>
            Suppliers will be notified and any open quotes will be withdrawn. This can't be undone.
          </Dialog>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
